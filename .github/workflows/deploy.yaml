name: Deploy React App

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   
      contents: read 
          
    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Node.js 24
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ==========================================
      # 3. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: npm ci

      # ==========================================
      # 4. Build React application
      # ==========================================
      - name: Build React application
        run: npm run build

      # ==========================================
      # 5. Connect to Tailscale
      # ==========================================
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      # ==========================================
      # 6. Test SSH
      # ==========================================
      - name: Test SSH connection
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo 'SSH connection successful'"

      # ==========================================
      # 7. Prepare deployment directory
      # ==========================================
      - name: Prepare VPS
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p /home/${{ secrets.VPS_USER }}/my-react-app"

      # ==========================================
      # 8. Transfer project through SSH
      # ==========================================
      - name: Upload project
        run: |
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./dist' \
            -czf - . | \
          ssh \
            -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "tar -xzf - -C /home/${{ secrets.VPS_USER }}/my-react-app"

      # ==========================================
      # 9. Build and restart Docker
      # ==========================================
      - name: Deploy Docker container
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            << 'EOF'

          set -e

          APP_DIR="$HOME/my-react-app"

          echo "=================================="
          echo "Starting Docker deployment"
          echo "=================================="

          cd "$APP_DIR"

          echo "Building Docker image..."

          docker build \
            --pull \
            -t my-react-app:latest \
            .

          echo "Stopping old container..."

          docker stop my-react-app || true

          echo "Removing old container..."

          docker rm my-react-app || true

          echo "Starting new container..."

          docker run -d \
            --name my-react-app \
            --restart unless-stopped \
            -p 80:80 \
            my-react-app:latest

          echo "Cleaning unused images..."

          docker image prune -f

          echo "=================================="
          echo "Deployment successful"
          echo "=================================="

          docker ps --filter "name=my-react-app"

          EOF

      # ==========================================
      # 10. Cleanup SSH key
      # ==========================================
      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key